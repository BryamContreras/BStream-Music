name: Release installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.0"
  YT_DLP_VERSION: "2026.07.04"
  YT_DLP_ANDROID_SHA256: "495be29ff4d9d4e9be7eabdfef225221e5d5282e77f2f505abc6dca80349f3fd"
  YT_DLP_WINDOWS_SHA256: "52fe3c26dcf71fbdc85b528589020bb0b8e383155cfa81b64dd447bbe35e24b8"
  YT_DLP_LINUX_X64_SHA256: "6bbb3d314cde4febe36e5fa1d55462e29c974f63444e707871834f6d8cc210ae"
  YT_DLP_MACOS_SHA256: "498bd0dae17855c599d371d68ec5bafc439a9d8640e838be25c765a9792f261b"
  DENO_VERSION: "2.9.4"
  DENO_WINDOWS_X64_SHA256: "68ed08b05c56cf887e9aa509947dc3f468f7e12f47a13e5c1abd51d46d1453ef"
  DENO_LINUX_X64_SHA256: "c24f955d9fbfe0ea5ae2b501c8e71ae76e31e4c9782390a54a284b3364fda725"
  DENO_MACOS_X64_SHA256: "f757df6d3991e37601c69fad56c22b37c4ea77b5dcfad3636a642c2ba4c9b19f"
  DENO_MACOS_ARM64_SHA256: "6d17647fdbf9c587a581dba205054c4ccf732dae0a196cc1e9b44c07589db412"

jobs:
  quality:
    # Stable candidate for the required status check on protected branches.
    name: Required quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          gradle-version: "8.14.3"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure Android Gradle properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test tool

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Test Android yt-dlp update policy
        working-directory: android
        run: |
          gradle --version
          gradle :app:testDebugUnitTest --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
          archive: false

  metadata:
    name: Read app metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+)[[:space:]]*(#.*)?$/\1/p' pubspec.yaml)"
          if [[ ! "$pubspec_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$ ]]; then
            echo "pubspec.yaml must contain one stable X.Y.Z version with an optional numeric build suffix" >&2
            exit 1
          fi
          app_version="${BASH_REMATCH[1]}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v$app_version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Release tag '$GITHUB_REF_NAME' must exactly match pubspec version '$expected_tag'" >&2
              exit 1
            fi
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  android:
    name: Android release APKs
    needs: [metadata, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}
      BSTREAM_ANDROID_KEYSTORE_BASE64: ${{ secrets.BSTREAM_ANDROID_KEYSTORE_BASE64 }}
      BSTREAM_ANDROID_STORE_PASSWORD: ${{ secrets.BSTREAM_ANDROID_STORE_PASSWORD }}
      BSTREAM_ANDROID_KEY_ALIAS: ${{ secrets.BSTREAM_ANDROID_KEY_ALIAS }}
      BSTREAM_ANDROID_KEY_PASSWORD: ${{ secrets.BSTREAM_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BSTREAM_ANDROID_KEYSTORE_BASE64
            BSTREAM_ANDROID_STORE_PASSWORD
            BSTREAM_ANDROID_KEY_ALIAS
            BSTREAM_ANDROID_KEY_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required GitHub secret is missing: $variable" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/bstream-upload-keystore.jks"
          printf '%s' "$BSTREAM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "BSTREAM_ANDROID_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Build ARMv7, ARMv8, and x86_64 APKs
        run: >-
          flutter build apk
          --release
          --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Verify and name Android APKs
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/build/app/outputs/flutter-apk"
          arm32="$output/app-armeabi-v7a-release.apk"
          arm64="$output/app-arm64-v8a-release.apk"
          x64="$output/app-x86_64-release.apk"
          test -f "$arm32"
          test -f "$arm64"
          test -f "$x64"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt2"
          "$apksigner" verify --verbose "$arm32"
          "$apksigner" verify --verbose "$arm64"
          "$apksigner" verify --verbose "$x64"

          verify_abi() {
            apk="$1"
            abi="$2"
            entries="$(unzip -Z1 "$apk")"
            printf '%s\n' "$entries" | grep -Fx "lib/$abi/libflutter.so"
            printf '%s\n' "$entries" | grep -Fx "lib/$abi/libpython.so"
            printf '%s\n' "$entries" | grep -Fx "lib/$abi/libpython.zip.so"
            printf '%s\n' "$entries" | grep -Fx "lib/$abi/libqjs.so"
            if printf '%s\n' "$entries" |
              awk -F/ -v expected="$abi" '$1 == "lib" && $2 != expected { print; found=1 } END { exit !found }'
            then
              echo "APK contains native libraries for an unexpected ABI: $apk" >&2
              exit 1
            fi
          }

          verify_ytdlp() {
            apk="$1"
            verify_dir="$(mktemp -d)"
            resource_path="$(
              "$aapt2" dump resources "$apk" |
                sed -n '/raw\/ytdlp/{n;s/.*(file) \([^ ]*\).*/\1/p;q;}'
            )"
            test -n "$resource_path"
            unzip -q -j "$apk" "$resource_path" -d "$verify_dir"
            extracted="$verify_dir/$(basename "$resource_path")"
            actual_hash="$(sha256sum "$extracted" | cut -d ' ' -f 1)"
            test "$actual_hash" = "$YT_DLP_ANDROID_SHA256"
            actual_version="$(python3 "$extracted" --version)"
            test "$actual_version" = "$YT_DLP_VERSION"
            rm -r "$verify_dir"
          }
          verify_abi "$arm32" "armeabi-v7a"
          verify_abi "$arm64" "arm64-v8a"
          verify_abi "$x64" "x86_64"
          verify_ytdlp "$arm32"
          verify_ytdlp "$arm64"
          verify_ytdlp "$x64"

          mkdir -p dist
          cp "$arm32" "dist/BStream-Music-$APP_VERSION-Android-armeabi-v7a.apk"
          cp "$arm64" "dist/BStream-Music-$APP_VERSION-Android-arm64-v8a.apk"
          cp "$x64" "dist/BStream-Music-$APP_VERSION-Android-x86_64.apk"

      - name: Enforce Android artifact size budgets
        run: |
          # About 10% above the measured 1.2.5 artifacts, including IPADIC.
          dart run tool/check_artifact_size.dart "dist/BStream-Music-$APP_VERSION-Android-armeabi-v7a.apk" 49
          dart run tool/check_artifact_size.dart "dist/BStream-Music-$APP_VERSION-Android-arm64-v8a.apk" 51
          dart run tool/check_artifact_size.dart "dist/BStream-Music-$APP_VERSION-Android-x86_64.apk" 51

      - name: Upload Android ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-Android-armeabi-v7a
          path: dist/BStream-Music-${{ env.APP_VERSION }}-Android-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Android ARMv8 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-Android-arm64-v8a
          path: dist/BStream-Music-${{ env.APP_VERSION }}-Android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Android x86_64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-Android-x86_64
          path: dist/BStream-Music-${{ env.APP_VERSION }}-Android-x86_64.apk
          if-no-files-found: error
          retention-days: 30
          archive: false

  windows:
    name: Windows x64 installer
    needs: [metadata, quality]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust for Windows SMTC
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install pinned NuGet CLI
        shell: pwsh
        run: ./tool/ensure_nuget.ps1

      - name: Resolve dependencies
        run: |
          flutter clean
          flutter pub get --enforce-lockfile

      - name: Prepare yt-dlp and Deno
        shell: pwsh
        run: |
          $tools = Join-Path $PWD "windows/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YT_DLP_VERSION/yt-dlp.exe" `
            -OutFile (Join-Path $tools "yt-dlp.exe")

          $ytDlp = Join-Path $tools "yt-dlp.exe"
          $ytDlpHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $ytDlp).Hash.ToLowerInvariant()
          if ($ytDlpHash -ne $env:YT_DLP_WINDOWS_SHA256) {
            throw "yt-dlp.exe checksum mismatch: $ytDlpHash"
          }

          $denoArchive = Join-Path $env:RUNNER_TEMP "deno-windows-x64.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/download/v$env:DENO_VERSION/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile $denoArchive

          $denoHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $denoArchive).Hash.ToLowerInvariant()
          if ($denoHash -ne $env:DENO_WINDOWS_X64_SHA256) {
            throw "Deno archive checksum mismatch: $denoHash"
          }

          Expand-Archive -LiteralPath $denoArchive -DestinationPath $tools -Force
          $deno = Join-Path $tools "deno.exe"
          if (!(Test-Path -LiteralPath $deno)) {
            throw "Deno executable was not extracted."
          }

          & $deno --version
          if ($LASTEXITCODE -ne 0) { throw "Deno could not start: $LASTEXITCODE" }
          & $deno eval 'let total = 0; for (let index = 0; index < 100000; index++) total += index; if (total !== 4999950000) Deno.exit(1);'
          if ($LASTEXITCODE -ne 0) { throw "Deno could not execute JavaScript: $LASTEXITCODE" }
          & (Join-Path $tools "yt-dlp.exe") `
            --ignore-config `
            --js-runtimes "deno:$deno" `
            --js-runtimes node `
            --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp rejected Deno: $LASTEXITCODE" }

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build/windows/x64/runner/Release"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found." }

          $vsInstall = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsInstall) { throw "A Visual Studio installation with C++ tools was not found." }

          $redistRoot = Join-Path $vsInstall "VC/Redist/MSVC"
          $crtDir = Get-ChildItem `
            -Path (Join-Path $redistRoot "*/x64/Microsoft.VC*.CRT") `
            -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "vcruntime140.dll") } |
            Sort-Object {
              (Get-Item (Join-Path $_.FullName "vcruntime140.dll")).VersionInfo.FileVersionRaw
            } -Descending |
            Select-Object -First 1
          if (!$crtDir) { throw "The x64 Visual C++ runtime was not found." }

          Copy-Item -Path (Join-Path $crtDir.FullName "*.dll") -Destination $bundle

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build/windows/x64/runner/Release"
          $required = @(
            (Join-Path $bundle "bstream_music.exe"),
            (Join-Path $bundle "THIRD_PARTY_NOTICES.md"),
            (Join-Path $bundle "tools/yt-dlp.exe"),
            (Join-Path $bundle "tools/deno.exe"),
            (Join-Path $bundle "msvcp140.dll"),
            (Join-Path $bundle "vcruntime140.dll"),
            (Join-Path $bundle "vcruntime140_1.dll")
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Required Windows bundle file is missing: $path"
            }
          }

          $obsolete = @(
            (Join-Path $bundle "tools/tiktok-live-bridge"),
            (Join-Path $bundle "tools/tiktok_live_bridge"),
            (Join-Path $bundle "tools/tiktok_live_bridge.exe"),
            (Join-Path $bundle "tools/tiktok-live-bridge.exe"),
            (Join-Path $bundle "scripts/tiktok_live_bridge.py"),
            (Join-Path $bundle "scripts/requirements-tiktok.txt")
          )
          foreach ($path in $obsolete) {
            if (Test-Path -LiteralPath $path) {
              throw "Obsolete TikTok LIVE Python artifact remains in bundle: $path"
            }
          }

          $bundledDeno = Join-Path $bundle "tools/deno.exe"
          & $bundledDeno --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deno could not start: $LASTEXITCODE" }
          & $bundledDeno eval 'let total = 0; for (let index = 0; index < 100000; index++) total += index; if (total !== 4999950000) Deno.exit(1);'
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deno could not execute JavaScript: $LASTEXITCODE" }
          & (Join-Path $bundle "tools/yt-dlp.exe") `
            --ignore-config `
            --js-runtimes "deno:$bundledDeno" `
            --js-runtimes node `
            --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled yt-dlp rejected Deno: $LASTEXITCODE" }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$iscc) { throw "Inno Setup 6 was not found on the runner." }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "packaging/windows/BStreamMusic.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $installer = Join-Path $PWD "dist/BStream-Music-$env:APP_VERSION-Windows-x64-Setup.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "The Windows installer was not generated." }

      - name: Enforce Windows installer size budget
        shell: pwsh
        run: >-
          dart run tool/check_artifact_size.dart
          "dist/BStream-Music-$env:APP_VERSION-Windows-x64-Setup.exe" 88

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "dist/BStream-Music-$env:APP_VERSION-Windows-x64-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "bstream-music-smoke-install"
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=`"$installDir`"") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed with exit code $($install.ExitCode)." }

          $required = @(
            (Join-Path $installDir "bstream_music.exe"),
            (Join-Path $installDir "THIRD_PARTY_NOTICES.md"),
            (Join-Path $installDir "tools/yt-dlp.exe"),
            (Join-Path $installDir "tools/deno.exe"),
            (Join-Path $installDir "msvcp140.dll"),
            (Join-Path $installDir "vcruntime140.dll"),
            (Join-Path $installDir "vcruntime140_1.dll")
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "Installed file is missing: $path"
            }
          }

          $obsolete = @(
            (Join-Path $installDir "tools/tiktok-live-bridge"),
            (Join-Path $installDir "tools/tiktok_live_bridge"),
            (Join-Path $installDir "tools/tiktok_live_bridge.exe"),
            (Join-Path $installDir "tools/tiktok-live-bridge.exe"),
            (Join-Path $installDir "scripts/tiktok_live_bridge.py"),
            (Join-Path $installDir "scripts/requirements-tiktok.txt")
          )
          foreach ($path in $obsolete) {
            if (Test-Path -LiteralPath $path) {
              throw "Obsolete TikTok LIVE Python artifact remains installed: $path"
            }
          }

          $installedDeno = Join-Path $installDir "tools/deno.exe"
          & $installedDeno --version
          if ($LASTEXITCODE -ne 0) { throw "Installed Deno could not start: $LASTEXITCODE" }
          & $installedDeno eval 'let total = 0; for (let index = 0; index < 100000; index++) total += index; if (total !== 4999950000) Deno.exit(1);'
          if ($LASTEXITCODE -ne 0) { throw "Installed Deno could not execute JavaScript: $LASTEXITCODE" }
          & (Join-Path $installDir "tools/yt-dlp.exe") `
            --ignore-config `
            --js-runtimes "deno:$installedDeno" `
            --js-runtimes node `
            --version
          if ($LASTEXITCODE -ne 0) { throw "Installed yt-dlp rejected Deno: $LASTEXITCODE" }

          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke test failed with exit code $($uninstall.ExitCode)." }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-Windows-x64-Setup
          path: dist/BStream-Music-${{ env.APP_VERSION }}-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
          archive: false

  linux:
    name: Linux x64 installers
    needs: [metadata, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev \
            libmpv-dev \
            desktop-file-utils \
            rpm \
            unzip

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare yt-dlp and Deno
        shell: bash
        run: |
          set -euo pipefail
          tools="$PWD/linux/tools"
          mkdir -p "$tools"

          curl --fail --location --retry 3 \
            "https://github.com/yt-dlp/yt-dlp/releases/download/$YT_DLP_VERSION/yt-dlp_linux" \
            --output "$tools/yt-dlp"

          echo "$YT_DLP_LINUX_X64_SHA256  $tools/yt-dlp" \
            | sha256sum --check -

          deno_archive="$RUNNER_TEMP/deno-linux-x64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip" \
            --output "$deno_archive"

          echo "$DENO_LINUX_X64_SHA256  $deno_archive" \
            | sha256sum --check -

          unzip -o "$deno_archive" -d "$tools"
          chmod 755 "$tools/yt-dlp" "$tools/deno"

          "$tools/deno" --version
          "$tools/deno" eval \
            'let total = 0; for (let index = 0; index < 100000; index++) total += index; if (total !== 4999950000) Deno.exit(1);'
          "$tools/yt-dlp" \
            --ignore-config \
            --js-runtimes "deno:$tools/deno" \
            --js-runtimes node \
            --version

      - name: Build Linux release
        run: flutter build linux --release

      - name: Verify Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$PWD/build/linux/x64/release/bundle"
          test -x "$bundle/bstream_music"
          test -x "$bundle/tools/yt-dlp"
          test -x "$bundle/tools/deno"
          "$bundle/tools/deno" --version
          "$bundle/tools/deno" eval \
            'let total = 0; for (let index = 0; index < 100000; index++) total += index; if (total !== 4999950000) Deno.exit(1);'
          "$bundle/tools/yt-dlp" \
            --ignore-config \
            --js-runtimes "deno:$bundle/tools/deno" \
            --js-runtimes node \
            --version
          desktop-file-validate packaging/linux/com.bstream.bstream_music.desktop

          missing=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'ELF'; then
              dependencies="$(ldd "$candidate" 2>&1 || true)"
              if grep -q 'not found' <<<"$dependencies"; then
                printf 'Missing shared library for %s:\n%s\n' "$candidate" "$dependencies" >&2
                missing=1
              fi
            fi
          done < <(find "$bundle" -type f -print0)
          test "$missing" -eq 0

      - name: Build DEB and RPM installers
        shell: bash
        run: |
          chmod 755 packaging/linux/build_packages.sh packaging/linux/bstream-music
          packaging/linux/build_packages.sh \
            "$PWD/build/linux/x64/release/bundle" \
            "$APP_VERSION" \
            "$PWD/dist"

      - name: Enforce Linux installer size budgets
        run: |
          dart run tool/check_artifact_size.dart "dist/BStream-Music-$APP_VERSION-linux-amd64.deb" 108
          dart run tool/check_artifact_size.dart "dist/BStream-Music-$APP_VERSION-linux-x86_64.rpm" 121

      - name: Upload Debian installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-Linux-DEB-amd64
          path: dist/BStream-Music-${{ env.APP_VERSION }}-linux-amd64.deb
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload RPM installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-Linux-RPM-x86_64
          path: dist/BStream-Music-${{ env.APP_VERSION }}-linux-x86_64.rpm
          if-no-files-found: error
          retention-days: 30
          archive: false

  macos:
    name: macOS ${{ matrix.arch }} installer
    needs: [metadata, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.metadata.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            host_arch: arm64
            max_mib: 134
          - runner: macos-26-intel
            arch: x64
            host_arch: x86_64
            max_mib: 140

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [[ "$actual" != "${{ matrix.host_arch }}" ]]; then
            echo "Expected ${{ matrix.host_arch }} runner, received $actual" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare yt-dlp and Deno
        shell: bash
        run: |
          set -euo pipefail
          tools="$PWD/macos/tools"
          mkdir -p "$tools"

          curl --fail --location --retry 3 \
            "https://github.com/yt-dlp/yt-dlp/releases/download/$YT_DLP_VERSION/yt-dlp_macos" \
            --output "$tools/yt-dlp"

          echo "$YT_DLP_MACOS_SHA256  $tools/yt-dlp" \
            | shasum -a 256 --check

          case "${{ matrix.host_arch }}" in
            arm64)
              deno_target="aarch64-apple-darwin"
              deno_sha256="$DENO_MACOS_ARM64_SHA256"
              ;;
            x86_64)
              deno_target="x86_64-apple-darwin"
              deno_sha256="$DENO_MACOS_X64_SHA256"
              ;;
            *)
              echo "Unsupported Deno architecture: ${{ matrix.host_arch }}" >&2
              exit 1
              ;;
          esac

          deno_archive="$RUNNER_TEMP/deno-$deno_target.zip"
          curl --fail --location --retry 3 \
            "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-$deno_target.zip" \
            --output "$deno_archive"

          echo "$deno_sha256  $deno_archive" | shasum -a 256 --check
          /usr/bin/ditto -x -k "$deno_archive" "$tools"
          chmod 755 "$tools/yt-dlp" "$tools/deno"

          codesign --verify --strict --verbose=2 "$tools/yt-dlp"
          "$tools/deno" --version
          "$tools/deno" eval \
            'let total = 0; for (let index = 0; index < 100000; index++) total += index; if (total !== 4999950000) Deno.exit(1);'
          "$tools/yt-dlp" \
            --ignore-config \
            --js-runtimes "deno:$tools/deno" \
            --js-runtimes node \
            --version

      - name: Build macOS release
        run: flutter build macos --release

      - name: Sign embedded macOS code consistently
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/bstream_music.app"
          bash macos/sign_release_bundle.sh "$app"

      - name: Audit macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/bstream_music.app"
          bash macos/verify_release_bundle.sh \
            "$app" \
            "${{ matrix.host_arch }}" \
            "$APP_VERSION"

      - name: Smoke test bundled macOS tools
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/bstream_music.app"
          bundled_yt_dlp="$app/Contents/Resources/tools/yt-dlp"

          cmp "$PWD/macos/tools/yt-dlp" "$bundled_yt_dlp"
          bash macos/verify_bundled_tools.sh \
            "$app" \
            "${{ matrix.host_arch }}" \
            "$YT_DLP_MACOS_SHA256"

      - name: Smoke test macOS launch
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/bstream_music.app"
          executable="$app/Contents/MacOS/bstream_music"
          log="$RUNNER_TEMP/bstream-macos-smoke.log"

          "$executable" >"$log" 2>&1 &
          app_pid=$!

          for _ in {1..8}; do
            sleep 1
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || true
              cat "$log"
              echo "BStream Music terminated during the macOS launch smoke test." >&2
              exit 1
            fi
          done

          kill -TERM "$app_pid" 2>/dev/null || true
          wait "$app_pid" || true

      - name: Build macOS PKG installer
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/macos/Build/Products/Release/bstream_music.app"
          executable="$app/Contents/MacOS/bstream_music"
          bundled_tools="$app/Contents/Resources/tools"
          test -x "$executable"
          test -x "$bundled_tools/yt-dlp"
          test -x "$bundled_tools/deno"

          lipo "$executable" -verify_arch "${{ matrix.host_arch }}"
          lipo "$bundled_tools/yt-dlp" -verify_arch "${{ matrix.host_arch }}"
          lipo "$bundled_tools/deno" -verify_arch "${{ matrix.host_arch }}"

          payload="$RUNNER_TEMP/bstream-pkg-root"
          staged_app="$payload/Applications/BStream Music.app"
          rm -rf "$payload"
          mkdir -p "$payload/Applications"
          ditto "$app" "$staged_app"
          codesign --verify --deep --strict "$staged_app"
          bash macos/verify_bundled_tools.sh \
            "$staged_app" \
            "${{ matrix.host_arch }}" \
            "$YT_DLP_MACOS_SHA256"

          mkdir -p dist
          package="dist/BStream-Music-$APP_VERSION-macOS-${{ matrix.arch }}.pkg"
          pkgbuild \
            --root "$payload" \
            --install-location / \
            --identifier com.bstream.bstreamMusic.pkg \
            --version "$APP_VERSION" \
            --ownership recommended \
            "$package"
          payload_files="$RUNNER_TEMP/bstream-payload-files.txt"
          pkgutil --payload-files "$package" >"$payload_files"
          grep -Fq \
            "BStream Music.app/Contents/MacOS/bstream_music" \
            "$payload_files"
          grep -Fq \
            "BStream Music.app/Contents/Resources/tools/yt-dlp" \
            "$payload_files"
          grep -Fq \
            "BStream Music.app/Contents/Resources/tools/deno" \
            "$payload_files"

          expanded_package="$RUNNER_TEMP/bstream-expanded-pkg"
          rm -rf "$expanded_package"
          pkgutil --expand-full "$package" "$expanded_package"
          packaged_app="$(
            find "$expanded_package" -type d -name "BStream Music.app" \
              -print -quit
          )"
          test -n "$packaged_app"
          bash macos/verify_bundled_tools.sh \
            "$packaged_app" \
            "${{ matrix.host_arch }}" \
            "$YT_DLP_MACOS_SHA256"

      - name: Enforce macOS installer size budget
        run: >-
          dart run tool/check_artifact_size.dart
          "dist/BStream-Music-$APP_VERSION-macOS-${{ matrix.arch }}.pkg"
          ${{ matrix.max_mib }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BStream-Music-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}
          path: dist/BStream-Music-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 30
          archive: false
